name: chameleon_flutter
description: "Platform transports and DFU channels for the chameleon SDK."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  chameleon: ^0.1.0
  libserialport_plus: ^1.0.4
  universal_ble: ^2.2.0
  usb_serial: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

