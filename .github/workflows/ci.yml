name: ci
# The branch gets CI through draft PR #1 (push only triggers on main); the
# macOS integration job runs on main pushes and on manual dispatch, never on PRs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # release.yml calls this workflow so a release never packages a tree that
  # would fail CI. The macOS integration twins are a post-merge canary, not
  # the release gate (ruling 10-7): the caller opts out of them.
  workflow_call:
    inputs:
      integration:
        description: Run the macOS integration job.
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsqlite3-dev
      - run: flutter pub get
      - run: dart format --set-exit-if-changed packages app tool test
      - run: dart analyze --fatal-infos packages app tool test
      - run: dart run tool/dep_lint.dart
      - run: dart test
      - run: bash tool/check_codegen.sh
        env:
          MISE_X: ""
      # Needed because `melos exec` shells out to the `melos` binary.
      - run: dart pub global activate melos
      - run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
      - run: dart run melos run test:dart
      - run: dart run melos run test:flutter

  integration:
    needs: check
    if: github.event_name != 'pull_request' && inputs.integration != false
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The phase gates on a real engine, in emulator mode: no hardware.
      # One `flutter test` per file, and any app process left behind by the
      # previous file is killed first: macOS activates an already-running
      # instance of the same bundle instead of launching a new one, so the
      # tool then waits forever for a debug connection (release runs
      # 33820681831 and 33821959493).
      - run: |
          set -euo pipefail
          for f in integration_test/*_test.dart; do
            echo "== $f"
            pkill -x spectra || true
            flutter test "$f" -d macos --timeout 300s
          done
          pkill -x spectra || true
        working-directory: app

  build:
    needs: check
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            cmd: flutter build linux --debug
            dir: app
          - os: windows-latest
            target: windows
            cmd: flutter build windows --debug
            dir: app
          - os: macos-latest
            target: macos
            cmd: flutter build macos --debug
            dir: app
          - os: macos-latest
            target: ios
            cmd: flutter build ios --debug --no-codesign
            dir: app
          - os: ubuntu-latest
            target: android
            cmd: flutter build apk --debug
            dir: app
          - os: windows-latest
            target: example-windows
            cmd: flutter build windows --debug
            dir: packages/chameleon_flutter/example
          - os: ubuntu-latest
            target: example-linux
            cmd: flutter build linux --debug
            dir: packages/chameleon_flutter/example
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - run: ${{ matrix.cmd }}
        working-directory: ${{ matrix.dir }}
