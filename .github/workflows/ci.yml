name: ci
on:
  pull_request:
  push:
    branches: [main]

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: dart analyze --fatal-infos .
      - run: dart run tool/dep_lint.dart
      - run: bash tool/check_codegen.sh
        env:
          MISE_X: ""
      - run: dart pub global activate melos
      - run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
      - run: dart run melos run test:dart
      - run: dart run melos run test:flutter

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            cmd: flutter build linux --debug
          - os: windows-latest
            target: windows
            cmd: flutter build windows --debug
          - os: macos-latest
            target: macos
            cmd: flutter build macos --debug
          - os: macos-latest
            target: ios
            cmd: flutter build ios --debug --no-codesign
          - os: ubuntu-latest
            target: android
            cmd: flutter build apk --debug
          # TEMPORARY (Spike A): probe libserialport_plus build hooks on
          # Windows and Linux. Removed once the spike verdict is recorded.
          - os: ubuntu-latest
            target: linux
            cmd: flutter build linux --debug
            workdir: packages/chameleon_flutter/example
          - os: windows-latest
            target: windows
            cmd: flutter build windows --debug
            workdir: packages/chameleon_flutter/example
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - run: ${{ matrix.cmd }}
        working-directory: ${{ matrix.workdir || 'app' }}
      # TEMPORARY (Spike A): prove the code-assets build hook actually
      # produced a libserialport native asset, not just a green build.
      - if: matrix.workdir != ''
        shell: bash
        working-directory: ${{ matrix.workdir }}
        run: |
          echo "native assets produced:"
          found=$(find build -iname '*serialport*' -print)
          echo "$found"
          test -n "$found"
